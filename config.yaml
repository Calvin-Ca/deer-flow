# DeerFlow Configuration
# Generated by 'make setup' on 2026-05-12
# Run 'make setup' to reconfigure, or edit this file for advanced options.
# Full reference: config.example.yaml

config_version: 9
log_level: info
token_usage:
  enabled: true
models:
# ── 阿里云百炼 / 通义千问（OpenAI 兼容；当前 agent 默认模型，列表第一项即默认）──────────
#    api_key 是占位符，可安全推送。服务器上 `git pull` 后替换成真实密钥即可；
#    ⚠️ 服务器填好真 key 后，那份 config.yaml 也别再 commit（否则下次 push 会把 key 带回 GitHub）。
- name: gateway-llm
  display_name: 通义千问（阿里云百炼）
  use: langchain_openai:ChatOpenAI
  model: qwen-plus                  # ← 可改：qwen-max(更强) / qwen-turbo(更快更便宜) / qwen3-235b-a22b 等
  api_key: REPLACE_WITH_DASHSCOPE_KEY_ON_SERVER   # ← 服务器上换成真实 sk-... 密钥
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
# ── 服务器 vLLM Qwen3-8B（临时注释；要切回：取消下面注释 + 注释掉上面网关那段）────────
# - name: qwen3-8b
#   display_name: Qwen3-8B (本地)
#   use: deerflow.models.vllm_provider:VllmChatModel
#   model: qwen3-8b
#   api_key: none
#   base_url: http://localhost:8099/v1
#   supports_thinking: true
#   when_thinking_enabled:
#     extra_body:
#       chat_template_kwargs:
#         enable_thinking: true
#   when_thinking_disabled:
#     extra_body:
#       chat_template_kwargs:
#         enable_thinking: false
tool_groups:
- name: web
- name: file:read
- name: file:write
- name: bash
tools:
- name: web_search
  use: deerflow.community.ddg_search.tools:web_search_tool
  group: web
  max_results: 5
- name: web_fetch
  use: deerflow.community.jina_ai.tools:web_fetch_tool
  group: web
  timeout: 10
- name: image_search
  group: web
  use: deerflow.community.image_search.tools:image_search_tool
  max_results: 5
- name: ls
  group: file:read
  use: deerflow.sandbox.tools:ls_tool
- name: read_file
  group: file:read
  use: deerflow.sandbox.tools:read_file_tool
- name: glob
  group: file:read
  use: deerflow.sandbox.tools:glob_tool
  max_results: 200
- name: grep
  group: file:read
  use: deerflow.sandbox.tools:grep_tool
  max_results: 100
- name: write_file
  use: deerflow.sandbox.tools:write_file_tool
  group: file:write
- name: str_replace
  use: deerflow.sandbox.tools:str_replace_tool
  group: file:write
- name: bash
  use: deerflow.sandbox.tools:bash_tool
  group: bash
tool_search:
  enabled: false
loop_detection:
  enabled: true
  warn_threshold: 3
  hard_limit: 5
  window_size: 20
  max_tracked_threads: 100
  tool_freq_warn: 30
  tool_freq_hard_limit: 50
uploads:
  max_files: 10
  max_file_size: 52428800
  max_total_size: 104857600
  auto_convert_documents: false
  pdf_converter: auto
sandbox:
  use: deerflow.sandbox.local:LocalSandboxProvider
  allow_host_bash: true
  bash_output_max_chars: 20000
  read_file_output_max_chars: 50000
  ls_output_max_chars: 20000
skills:
  container_path: /mnt/skills
title:
  enabled: true
  max_words: 6
  max_chars: 60
  model_name: null
summarization:
  enabled: true
  model_name: null
  trigger:
  - type: tokens
    value: 15564
  keep:
    type: messages
    value: 10
  trim_tokens_to_summarize: 15564
  summary_prompt: null
  preserve_recent_skill_count: 5
  preserve_recent_skill_tokens: 25000
  preserve_recent_skill_tokens_per_skill: 5000
  skill_file_read_tool_names:
  - read_file
  - read
  - view
  - cat
memory:
  enabled: true
  storage_path: memory.json
  debounce_seconds: 30
  model_name: null
  max_facts: 100
  fact_confidence_threshold: 0.7
  injection_enabled: true
  max_injection_tokens: 2000
subagents:
  # 规范合规审查 sub-agent（compliance-checker）已随规范 RAG 退役（2026-06-18）。
  # CostAgent 选码闭环 P3 阶段再注册 cost-agent 自定义 agent + skill。
  custom_agents: {}
agents_api:
  enabled: false
skill_evolution:
  enabled: false
  moderation_model_name: null
database:
  backend: sqlite
  sqlite_dir: .deer-flow/data
run_events:
  backend: jsonl
  max_trace_content: 10240
  track_token_usage: true
