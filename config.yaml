# DeerFlow Configuration
# Generated by 'make setup' on 2026-05-12
# Run 'make setup' to reconfigure, or edit this file for advanced options.
# Full reference: config.example.yaml

config_version: 9
log_level: info
token_usage:
  enabled: true
models:
- name: qwen3-8b
  display_name: Qwen3-8B (本地)
  use: deerflow.models.vllm_provider:VllmChatModel
  model: qwen3-8b
  api_key: none
  base_url: http://localhost:8099/v1
  extra_body:
    chat_template_kwargs:
      enable_thinking: false
tool_groups:
- name: web
- name: file:read
- name: file:write
- name: bash
tools:
- name: web_search
  use: deerflow.community.ddg_search.tools:web_search_tool
  group: web
  max_results: 5
- name: web_fetch
  use: deerflow.community.jina_ai.tools:web_fetch_tool
  group: web
  timeout: 10
- name: image_search
  group: web
  use: deerflow.community.image_search.tools:image_search_tool
  max_results: 5
- name: ls
  group: file:read
  use: deerflow.sandbox.tools:ls_tool
- name: read_file
  group: file:read
  use: deerflow.sandbox.tools:read_file_tool
- name: glob
  group: file:read
  use: deerflow.sandbox.tools:glob_tool
  max_results: 200
- name: grep
  group: file:read
  use: deerflow.sandbox.tools:grep_tool
  max_results: 100
- name: write_file
  use: deerflow.sandbox.tools:write_file_tool
  group: file:write
- name: str_replace
  use: deerflow.sandbox.tools:str_replace_tool
  group: file:write
- name: bash
  use: deerflow.sandbox.tools:bash_tool
  group: bash
tool_search:
  enabled: false
loop_detection:
  enabled: true
  warn_threshold: 3
  hard_limit: 5
  window_size: 20
  max_tracked_threads: 100
  tool_freq_warn: 30
  tool_freq_hard_limit: 50
uploads:
  max_files: 10
  max_file_size: 52428800
  max_total_size: 104857600
  auto_convert_documents: false
  pdf_converter: auto
sandbox:
  use: deerflow.sandbox.local:LocalSandboxProvider
  allow_host_bash: true
  bash_output_max_chars: 20000
  read_file_output_max_chars: 50000
  ls_output_max_chars: 20000
skills:
  container_path: /mnt/skills
title:
  enabled: true
  max_words: 6
  max_chars: 60
  model_name: null
summarization:
  enabled: true
  model_name: null
  trigger:
  - type: tokens
    value: 15564
  keep:
    type: messages
    value: 10
  trim_tokens_to_summarize: 15564
  summary_prompt: null
  preserve_recent_skill_count: 5
  preserve_recent_skill_tokens: 25000
  preserve_recent_skill_tokens_per_skill: 5000
  skill_file_read_tool_names:
  - read_file
  - read
  - view
  - cat
memory:
  enabled: true
  storage_path: memory.json
  debounce_seconds: 30
  model_name: null
  max_facts: 100
  fact_confidence_threshold: 0.7
  injection_enabled: true
  max_injection_tokens: 2000
subagents:
  custom_agents:
    compliance-checker:
      description: >
        建筑规范合规检查专家。接收结构化的项目描述，自动执行参数提取 → 并行检索 →
        逐维度合规判定 → 反思校验，输出结构化强条清单（含逐条合规状态）。
        基于《建筑设计防火规范》GB 50016-2014(2018)。
        适用于：用户提供了明确项目参数后的完整合规检查。
      system_prompt: |
        你是建筑规范合规检查专家 sub-agent，专门负责执行 GB 50016 合规检查流程。

        **工作方式**：通过 bash 工具调用服务器上的合规检查脚本，完成完整的检查流程。

        **执行步骤**：
        1. 使用 bash 运行合规检查 skill（check.py），将项目描述作为参数传入
        2. 等待脚本执行完成（脚本内部完成参数提取 → 并行检索 → 按维度判定 → 反思校验）
        3. 读取输出的 JSON 报告
        4. 返回结构化摘要：建筑类别、各维度强条清单（含合规状态）、需补充参数、免责声明

        **服务器路径**：
        - 项目根：/mnt/nvme/calvin/code/deer-flow
        - Python 解释器：building-code-rag-poc/.venv/bin/python
        - Skill 入口：skills/public/compliance-check/check.py

        **bash 命令格式**：
        ```bash
        cd /mnt/nvme/calvin/code/deer-flow && \
          building-code-rag-poc/.venv/bin/python \
          skills/public/compliance-check/check.py \
          --project "<项目描述>" \
          --output /tmp/compliance_$(date +%s).json
        ```

        **输出格式**：返回完整的合规报告摘要，必须包含：
        - 建筑类别推断结果
        - 各维度强条数量及典型条款
        - 需补充信息的参数列表
        - 免责声明

        **注意**：
        - 直接执行，不要询问确认
        - 脚本耗时约 2-5 分钟，等待完成后再读取结果
        - 若服务不可用（Milvus/vLLM），在错误信息中说明哪个服务未启动
      tools:
        - bash
      disallowed_tools:
        - task
        - ask_clarification
        - present_files
      model: inherit
      max_turns: 10
      timeout_seconds: 600
agents_api:
  enabled: false
skill_evolution:
  enabled: false
  moderation_model_name: null
database:
  backend: sqlite
  sqlite_dir: .deer-flow/data
run_events:
  backend: memory
  max_trace_content: 10240
  track_token_usage: true
