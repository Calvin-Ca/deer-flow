# CE Rerank 服务（:8098）—— 从知识层拆出的 GPU 精排（bge-reranker-large）
#
# 知识层 :8100 通过 config.RERANK_URL（默认 http://localhost:8098）HTTP 调本服务；本服务不可达 →
# 知识层检索栈静默 fallback RRF（精排失效、召回不变）。故本服务可独立起停、共卡、按需伸缩。
#
# 启动（从项目根执行）：
#   cp docker/ce-rerank/.env.example docker/ce-rerank/.env   # 可选，改 GPU/缓存路径
#   docker compose -f docker/ce-rerank/docker-compose.yaml up -d
#
# GPU 索引说明（常见坑）：device_ids 把**物理** GPU N 分给容器后，容器内它就是 cuda:0，
#   故 CE_RERANK_DEVICE 用 cuda:0（≠ 宿主机上的物理编号）。改用哪张物理卡：设 CE_RERANK_GPU。

services:
  rerank:
    build:
      context: ../..
      dockerfile: docker/ce-rerank/Dockerfile
    image: ce-rerank:latest
    container_name: ce-rerank
    network_mode: host          # 复用宿主机网络，:8100 走 localhost:8098 调本服务
    restart: unless-stopped
    environment:
      # 容器内 torch 设备：reserve 单卡后它就是 cuda:0（不是宿主物理编号）
      - CE_RERANK_DEVICE=${CE_RERANK_DEVICE:-cuda:0}
      - HF_ENDPOINT=https://hf-mirror.com
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${CE_RERANK_GPU:-2}"]   # 把宿主物理 GPU N 分给本容器
              capabilities: [gpu]
    volumes:
      # bge-reranker-large 权重缓存，避免每次重下
      - ${HF_CACHE:-~/.cache/huggingface}:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8098/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s      # FlagEmbedding 首次加载模型较慢
