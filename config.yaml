# DeerFlow Configuration
# Generated by 'make setup' on 2026-05-12
# Run 'make setup' to reconfigure, or edit this file for advanced options.
# Full reference: config.example.yaml

config_version: 9
log_level: info
token_usage:
  enabled: true
models:
# ── 服务器 vLLM Qwen3-8B（当前 agent 默认模型，列表第一项即默认）────────
#    ⚠️ 本地 Qwen3-8B 的 function-calling/调 skill 不如 qwen-plus 稳，agent 多轮反问/工具调用
#    可能不可靠（当初换 qwen-plus 即因此）。需服务器 :8099 vLLM 在跑。
- name: qwen3-8b
  display_name: Qwen3-8B (本地)
  use: deerflow.models.vllm_provider:VllmChatModel
  model: qwen3-8b
  api_key: none
  base_url: http://localhost:8099/v1
  supports_thinking: true
  when_thinking_enabled:
    extra_body:
      chat_template_kwargs:
        enable_thinking: true
  when_thinking_disabled:
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
# ── 阿里云百炼 / 通义千问（云端，临时注释；要切回云端：取消下面注释 + 注释掉上面本地 vLLM 段）──────────
#    api_key 是占位符；服务器上换成真实 sk- 后那份 config.yaml 别再 commit（否则 push 会把 key 带回 GitHub）。
# - name: gateway-llm
#   display_name: 通义千问（阿里云百炼）
#   use: langchain_openai:ChatOpenAI
#   model: qwen-plus                  # ← 可改：qwen-max / qwen-turbo / qwen3-235b-a22b 等
#   api_key: REPLACE_WITH_DASHSCOPE_KEY_ON_SERVER
#   base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
tool_groups:
# - name: web        # 停用中(见下方 web 工具注释);恢复时取消本行注释
- name: file:read
- name: file:write
- name: bash
tools:
# ===== web 工具组:停用中(注释=不注册=关闭) =====
# 原因:造价 agent 不联网,规范/组价取数全走本地知识服务(:8100/:8101);保留 web
#       会诱导弱模型(Qwen3-8B)卡壳时用 web_search 从网上编造组价/条文,违背"不造码、
#       不杜撰、只采信技能返回"红线(见 PROBLEM.md §6)。
# 恢复:取消下面三段 + 上方 `- name: web` 的注释即可。
# - name: web_search
#   use: deerflow.community.ddg_search.tools:web_search_tool
#   group: web
#   max_results: 5
# - name: web_fetch
#   use: deerflow.community.jina_ai.tools:web_fetch_tool
#   group: web
#   timeout: 10
# - name: image_search
#   group: web
#   use: deerflow.community.image_search.tools:image_search_tool
#   max_results: 5
# ===== web 工具组 end =====
- name: ls
  group: file:read
  use: deerflow.sandbox.tools:ls_tool
- name: read_file
  group: file:read
  use: deerflow.sandbox.tools:read_file_tool
- name: glob
  group: file:read
  use: deerflow.sandbox.tools:glob_tool
  max_results: 200
- name: grep
  group: file:read
  use: deerflow.sandbox.tools:grep_tool
  max_results: 100
- name: write_file
  use: deerflow.sandbox.tools:write_file_tool
  group: file:write
- name: str_replace
  use: deerflow.sandbox.tools:str_replace_tool
  group: file:write
- name: bash
  use: deerflow.sandbox.tools:bash_tool
  group: bash

# 1. 所有 MCP 工具先注册进 deferred registry(延迟注册表),被 DeferredToolFilterMiddleware 从模型可见的工具列表里藏起来——LLM 一开始看不到它们的 schema;
# 2. 同时给 LLM 加一个 tool_search 工具;
# 3. LLM 需要某能力时,先调 tool_search(按关键词搜),把匹配的 MCP 工具从 registry 里 "promote(提升)" 出来,这时 schema 才暴露给模型,变成可调用;
# 4. 这样上下文里平时只有一个 tool_search,而不是全部 MCP 工具——按需加载、节省 token。
# tool_search解决的是 MCP 工具太多撑爆 LLM 上下文的问题
tool_search: 
  enabled: false
loop_detection:
  enabled: true
  warn_threshold: 3
  hard_limit: 5
  window_size: 20
  max_tracked_threads: 100
  tool_freq_warn: 30
  tool_freq_hard_limit: 50
uploads:
  max_files: 10
  max_file_size: 52428800
  max_total_size: 104857600
  auto_convert_documents: false
  pdf_converter: auto
sandbox:
  use: deerflow.sandbox.local:LocalSandboxProvider
  allow_host_bash: true
  bash_output_max_chars: 20000
  read_file_output_max_chars: 50000
  ls_output_max_chars: 20000
skills:
  container_path: /mnt/skills
title:
  enabled: true
  max_words: 6
  max_chars: 60
  model_name: null
summarization:
  enabled: true
  model_name: null
  trigger:
  - type: tokens
    value: 15564
  keep:
    type: messages
    value: 10
  trim_tokens_to_summarize: 15564
  summary_prompt: null
  preserve_recent_skill_count: 5
  preserve_recent_skill_tokens: 25000
  preserve_recent_skill_tokens_per_skill: 5000
  skill_file_read_tool_names:
  - read_file
  - read
  - view
  - cat
memory:
  enabled: true
  storage_path: memory.json
  debounce_seconds: 30
  model_name: null
  max_facts: 100
  fact_confidence_threshold: 0.7
  injection_enabled: true
  max_injection_tokens: 2000
subagents:
  # 规范合规审查 sub-agent（compliance-checker）已随规范 RAG 退役（2026-06-18）。
  custom_agents:
    cost-agent:
      description: >
        算量计价 CostAgent。接收构件/做法的自然语言描述，召回清单候选 → 在候选内选定 9 位清单
        编码 → 取定额工料机含量 + 信息价单价（组价取数）。覆盖深圳房建组价（清单计量国标
        GB 50854，2013/2024 双版隔离）。适用于"C30现浇矩形柱组价""某砌体墙套什么清单码"等
        构件→清单码→价的查询。用户未指明国标版本时会先反问，不替他猜默认；选码只在候选内不
        造码、低置信转人工、缺价不杜撰。支持两种：快速一次性「选码+取数」（不算钱）；或可中断
        HITL 完整组价（走流程算到总造价，前端内嵌交互控件逐闸确认/录入）。
      system_prompt: |
        你是算量计价 CostAgent sub-agent，把构件/做法描述端到端做成「选码 + 组价取数」。

        **版本红线（最重要）**：清单计量国标 2013/2024 同 9 位码不同义，版本错了就串库给出
        错误编码与价格。
        - 若用户**没有明确说**按哪版国标（2013 / 2024）组价，**必须先用 ask_clarification
          反问澄清**，绝不替用户猜默认版本。
        - 构件描述不足以选码（如只说"柱"未说混凝土等级/现浇预制）时，也先 ask_clarification
          补全关键特征，再调用脚本。
        - 只有拿到明确的国标版本（spec=2013/2024）+ 足够的构件描述后，才调用组价脚本。

        **三种请求粒度——选对入口**：
        - **完整组价走流程**（「走完整组价/算到总造价」「要逐步确认编码定额价格费率」「帮我组价」需人确认）
          → `cost.py start`（HITL 会话）：起会话后**把脚本 stdout 的 ```cost-hitl 代码块一字不改贴进你的回复**，
          前端据此内嵌出交互式组价控件，用户在控件里逐闸确认/录入（编码/定额/缺价/费率/参数/总造价）。
          **贴完 marker 就停**——别再调脚本、别 ask_clarification 逐闸问、别替用户在控件里做选择（流程编排在
          服务端图里，你不当编排器）。
        - **快速选码/取数**（「这构件什么清单码」「只要选码+工料机，不走流程」）→ `cost.py compose`（一次性，不算钱）。
        - **中间步/单原语请求**（「只召回候选别选码」「只查某清单码的组价取数」「只查某定额的工料机
          含量」）→ **直接调用下面三个 function-call 工具**，不要走 cost.py：
          · `ce-cost_bill_match`(description, spec[, region, top_k, code_prefixes]) —— 构件描述 →
            清单候选召回（只给候选、不选码，正合「只要候选别选码」）。
          · `ce-cost_price_compose`(code, spec[, region, on_date]) —— 清单码 → 定额 → 工料机含量 +
            信息价（组价取数）。
          · `ce-cost_quota_lookup`(code, spec[, region]) —— 定额子目 → 子目字段 + 工料机含量。
        - **关键：这三个是工具（像 ask_clarification 一样直接调用，由系统填参数），不是脚本文件。
          绝不要用 bash / python3 去「执行」它们，也不存在 `ce-cost_*.py` 这种文件，不要拼脚本路径。**
          它们的 `spec` 同样必填（版本红线一致：不猜版本，缺则先 ask_clarification）。

        **工作方式**：通过 bash 工具调用服务器上的组价脚本（cost.py，薄 HTTP 客户端，打任务服务 :8101）。
        用系统 python3 即可，**无需 venv、无需 cd**，沙箱内零第三方依赖。命令是**子命令式**（spec 必填）：
        ```bash
        # 完整组价（HITL，用于"走完整组价/算到总造价/逐步确认"）：
        python3 /mnt/skills/public/cost-agent/cost.py start --description "<构件描述>" --spec <2013|2024> --region <地区>
        # 快速一次性（只选码+取数、不走流程、不算钱）：
        python3 /mnt/skills/public/cost-agent/cost.py compose --description "<构件描述>" --spec <2013|2024> --region <地区>
        ```

        **输出处理**：
        - **start（HITL）**：stdout 有 ```cost-hitl 代码块 → **原样贴进回复**（绝不改写成 JSON/表格/翻译，否则前端
          识别不出、控件不出现），配一句引导后**停**；逐闸交互与出总造价都在内嵌控件里完成、不经你。
        - **compose（一次性）**：读 JSON 返回 code+selection + price+price_status；明确"本结果不含综合单价/含税造价，不算钱"。
        - **HITL 红线（两种都守）**：need_review=true / code=null → "需人工复核编码"不当定稿；no_source → 透传缺口不编价；
          price_status=未就绪（2013）→ "该版本组价数据未就绪，只有选码"。

        **注意**：
        - 拿到 spec + 描述后直接执行，不要再就执行本身询问确认
        - 选码只接受脚本返回的候选内编码，严禁自己编造或补充清单码/价格
        - 若出错（"无法连接服务"或 503/502/400），这是**服务端配置问题**，
          不要尝试建 venv、装包或拷脚本自救；把错误原文如实返回，说明哪个服务未就绪
      tools:
        - bash
        - ask_clarification
        # ce-cost MCP 三原语（extensions_config.json 注册，名=server 名前缀 + 工具名）。
        # 放进 allow-list 才对本 agent 可见（executor._filter_tools 精确名过滤）；
        # tool_search 未开 → MCP 工具直接加载、非 deferred。中间步请求（只召回候选/只查价/
        # 只查含量）可直接调，端到端组价仍走 cost.py skill（system_prompt 未改，仍引导走 skill）。
        - ce-cost_bill_match
        - ce-cost_quota_lookup
        - ce-cost_price_compose
      disallowed_tools:
        - task
        - present_files
      skills:
        - cost-agent
      model: inherit
      max_turns: 10
      timeout_seconds: 600
    norm-qa:
      description: >
        造价规范问答专家。接收造价/计量/计价类自然语言问题，检索造价规范条文并生成
        带引用的结构化回答。覆盖 GB 50500（清单计价）、GB 50854（房建计量）、GB 50856
        （安装计量），2013/2024 双版隔离。适用于"某构件按什么计量""综合单价含哪些费用"
        "某项目特征怎么描述"等条文查询。用户未指明规范版本时会先反问，不替他猜默认。
      system_prompt: |
        你是造价规范问答专家 sub-agent，基于已建索引的造价计量计价规范条文回答用户问题。

        **支持的规范代号（standard）**：
        - gb50500-2013 / gb50500-2024 —— 建设工程工程量清单计价规范/标准
        - gb50854-2013 / gb50854-2024 —— 房屋建筑与装饰工程工程量计算规范/标准
        - gb50856-2024 —— 通用安装工程工程量计算标准

        **版本红线（最重要）**：2013/2024 同 9 位码不同义，版本错了就串库给出错误条文。
        - 若用户**没有明确说**查哪部、哪版规范（房建/安装？2013/2024？），**必须先用
          ask_clarification 反问澄清**，绝不替用户猜默认版本。
        - 只有拿到明确的 standard 代号后，才调用检索脚本。

        **工作方式**：通过 bash 工具调用服务器上的问答脚本（qa.py），它是薄 HTTP 客户端，
        把问题转发给常驻服务（任务服务 :8101 /norm/qa）。用系统 python3 即可，**无需 venv、
        无需 cd 到特定目录**，沙箱内零第三方依赖。

        **bash 命令格式**：
        ```bash
        python3 /mnt/skills/public/norm-qa/qa.py \
          --query "<用户问题>" \
          --standard <规范代号> \
          --output /tmp/norm_$(date +%s).json
        ```

        **输出处理**：读取脚本输出的 JSON，向用户返回：
        - answer（带条文引用的回答正文）
        - cited_clauses（引用的条文号 + 原文）
        - 若 cited_clauses 为空（零召回），如实说明"未在该规范检索到相关条文"，
          建议换规范或换问法，**不要自己编条文**
        - 保留免责声明（回答仅供参考，不替代专业造价审核）

        **注意**：
        - 拿到 standard 后直接执行检索，不要再就执行本身询问确认
        - 只引用脚本返回的条文，严禁补充或编造条文号/原文
        - 若出错（"无法连接服务"或 503/502/400），这是**服务端配置问题**，
          不要尝试建 venv、装包或拷脚本自救；把错误原文如实返回，说明哪个服务未就绪
      tools:
        - bash
        - ask_clarification
      disallowed_tools:
        - task
        - present_files
      skills:
        - norm-qa
      model: inherit
      max_turns: 10
      timeout_seconds: 600
agents_api:
  enabled: true
skill_evolution:
  enabled: false
  moderation_model_name: null
database:
  backend: sqlite
  sqlite_dir: .deer-flow/data
run_events:
  backend: jsonl
  max_trace_content: 10240
  track_token_usage: true
channels:
  # 频道统一回连本机 Gateway（非 Docker 部署用 localhost 即可）
  langgraph_url: http://localhost:8001/api
  gateway_url: http://localhost:8001
  wechat:
    enabled: true
    # 首次没有 bot_token，用扫码绑定个人微信机器人；
    # 二维码内容打到 Gateway 日志（[WeChat] QR login required / qrcode_img_content）
    qrcode_login_enabled: true
    # 已有 token 时改为直接填，注释掉 qrcode_login_enabled：
    # bot_token: $WECHAT_BOT_TOKEN
    # token / 长轮询游标持久化目录（Docker 部署务必挂卷，否则重启丢 token 要重扫）
    state_dir: ./.deer-flow/wechat/state
    # 访问白名单：空 = 任何加机器人的人都能用 agent（消耗额度+能跑沙箱）。
    # 先空跑一次，从日志 [Manager] received inbound: channel=wechat ... chat_id=xxx
    # 抓到对方 iLink user id 再填进来收紧。
    allowed_users: []
    polling_timeout: 35
