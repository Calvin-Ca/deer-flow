# DeerFlow Configuration
# Generated by 'make setup' on 2026-05-12
# Run 'make setup' to reconfigure, or edit this file for advanced options.
# Full reference: config.example.yaml

config_version: 9
log_level: info
token_usage:
  enabled: true
models:
# ── 服务器 vLLM Qwen3-8B（当前 agent 默认模型，列表第一项即默认）────────
#    ⚠️ 本地 Qwen3-8B 的 function-calling/调 skill 不如 qwen-plus 稳，agent 多轮反问/工具调用
#    可能不可靠（当初换 qwen-plus 即因此）。需服务器 :8099 vLLM 在跑。
- name: qwen3-8b
  display_name: Qwen3-8B (172.19.3.136)
  use: deerflow.models.vllm_provider:VllmChatModel
  model: qwen3-8b
  api_key: none
  base_url: http://host.docker.internal:8099/v1
  supports_thinking: true
  when_thinking_enabled:
    extra_body:
      chat_template_kwargs:
        enable_thinking: true
  when_thinking_disabled:
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
# ── 服务器 vLLM Qwen3-32B-AWQ（桶 B：真·推理 + 选码消歧）────
#    另一台服务器 172.19.2.2 上的 vLLM，OpenAI 兼容端点 :8001/v1，模型 id 即权重路径
#    /models/Qwen3-32B-AWQ；同为 Qwen3 系（带 <think>），沿用 VllmChatModel 走 thinking 开关。
#    ✅ T-A5 已注册为**可用模型**，但**非默认**（8b 仍列表第一项 = agent 默认，桶 A 延迟敏感路径）。
#       deer-flow agent（norm-qa/cost-agent）默认仍走 8b；如后续把 workflow 某个节点升级为
#       agent/LLM 节点，可在该节点或子智能体配置中显式指定 32B。不要再把组价编排放回
#       旧任务层 HTTP API。
# - name: qwen3-32b-awq
#   display_name: Qwen3-32B-AWQ (172.19.2.2)
#   use: deerflow.models.vllm_provider:VllmChatModel
#   model: /models/Qwen3-32B-AWQ
#   api_key: none
#   base_url: http://172.19.2.2:8001/v1
#   supports_thinking: true
#   when_thinking_enabled:
#     extra_body:
#       chat_template_kwargs:
#         enable_thinking: true
#   when_thinking_disabled:
#     extra_body:
#       chat_template_kwargs:
#         enable_thinking: false
# ── 阿里云百炼 / 通义千问（云端，临时注释；要切回云端：取消下面注释 + 注释掉上面本地 vLLM 段）──────────
#    api_key 是占位符；服务器上换成真实 sk- 后那份 config.yaml 别再 commit（否则 push 会把 key 带回 GitHub）。
# - name: gateway-llm
#   display_name: 通义千问（阿里云百炼）
#   use: langchain_openai:ChatOpenAI
#   model: qwen-plus                  # ← 可改：qwen-max / qwen-turbo / qwen3-235b-a22b 等
#   api_key: REPLACE_WITH_DASHSCOPE_KEY_ON_SERVER
#   base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
tool_groups:
# - name: web        # 停用中(见下方 web 工具注释);恢复时取消本行注释
- name: ce:io        # 造价文件解析/装配（工程量清单 Excel 等确定性 IO）
- name: cost
- name: file:read
- name: file:write
- name: bash
tools:
# ===== web 工具组:停用中(注释=不注册=关闭) =====
# 原因:造价 agent 不联网,规范/组价取数全走本地知识服务(:8100/:8101);保留 web
#       会诱导弱模型(Qwen3-8B)卡壳时用 web_search 从网上编造组价/条文,违背"不造码、
#       不杜撰、只采信技能返回"红线(见 PROBLEM.md §6)。
# 恢复:取消下面三段 + 上方 `- name: web` 的注释即可。
# - name: web_search
#   use: deerflow.community.ddg_search.tools:web_search_tool
#   group: web
#   max_results: 5
# - name: web_fetch
#   use: deerflow.community.jina_ai.tools:web_fetch_tool
#   group: web
#   timeout: 10
# - name: image_search
#   group: web
#   use: deerflow.community.image_search.tools:image_search_tool
#   max_results: 5
# ===== web 工具组 end =====
- name: parse_boq_excel
  group: ce:io
  use: app.ce.io.excel_tools:parse_boq_excel_tool
- name: cost_workflow_start
  group: cost
  use: app.ce.cost.tools:cost_workflow_start_tool
- name: cost_workflow_node
  group: cost
  use: app.ce.cost.tools:cost_workflow_node_tool
- name: cost_workflow_resume
  group: cost
  use: app.ce.cost.tools:cost_workflow_resume_tool
- name: cost_workflow_state
  group: cost
  use: app.ce.cost.tools:cost_workflow_state_tool
- name: ls
  group: file:read
  use: deerflow.sandbox.tools:ls_tool
- name: read_file
  group: file:read
  use: deerflow.sandbox.tools:read_file_tool
- name: glob
  group: file:read
  use: deerflow.sandbox.tools:glob_tool
  max_results: 200
- name: grep
  group: file:read
  use: deerflow.sandbox.tools:grep_tool
  max_results: 100
- name: write_file
  use: deerflow.sandbox.tools:write_file_tool
  group: file:write
- name: str_replace
  use: deerflow.sandbox.tools:str_replace_tool
  group: file:write
- name: bash
  use: deerflow.sandbox.tools:bash_tool
  group: bash

# 1. 所有 MCP 工具先注册进 deferred registry(延迟注册表),被 DeferredToolFilterMiddleware 从模型可见的工具列表里藏起来——LLM 一开始看不到它们的 schema;
# 2. 同时给 LLM 加一个 tool_search 工具;
# 3. LLM 需要某能力时,先调 tool_search(按关键词搜),把匹配的 MCP 工具从 registry 里 "promote(提升)" 出来,这时 schema 才暴露给模型,变成可调用;
# 4. 这样上下文里平时只有一个 tool_search,而不是全部 MCP 工具——按需加载、节省 token。
# tool_search解决的是 MCP 工具太多撑爆 LLM 上下文的问题
tool_search:
  enabled: false
loop_detection:
  enabled: true
  warn_threshold: 3
  hard_limit: 5
  window_size: 20
  max_tracked_threads: 100
  tool_freq_warn: 30
  tool_freq_hard_limit: 50
uploads:
  max_files: 10
  max_file_size: 52428800
  max_total_size: 104857600
  auto_convert_documents: false
  pdf_converter: auto
sandbox:
  use: deerflow.sandbox.local:LocalSandboxProvider
  allow_host_bash: true
  bash_output_max_chars: 20000
  read_file_output_max_chars: 50000
  ls_output_max_chars: 20000
skills:
  container_path: /mnt/skills
title:
  enabled: true
  max_words: 6
  max_chars: 60
  model_name: null
summarization:
  enabled: true
  model_name: null
  trigger:
  - type: tokens
    value: 15564
  keep:
    type: messages
    value: 10
  trim_tokens_to_summarize: 15564
  summary_prompt: null
  preserve_recent_skill_count: 5
  preserve_recent_skill_tokens: 25000
  preserve_recent_skill_tokens_per_skill: 5000
  skill_file_read_tool_names:
  - read_file
  - read
  - view
  - cat
memory:
  enabled: true
  storage_path: memory.json
  debounce_seconds: 30
  model_name: null
  max_facts: 100
  fact_confidence_threshold: 0.7
  injection_enabled: true
  max_injection_tokens: 2000
lead_agent:
  system_prompt_path: prompts/ce/lead_agent.md
subagents:
  # 规范合规审查 sub-agent（compliance-checker）已随规范 RAG 退役（2026-06-18）。
  custom_agents:
    cost-agent:
      description: >
        算量计价 CostAgent（单点/批量「选码 + 取数」专用，一次跑完、不算钱、无 HITL）。接收构件/
        做法的自然语言描述，召回清单候选 → 在候选内选定 9 位清单编码 → 取定额工料机含量 + 信息价
        单价（组价取数）。覆盖深圳房建组价（清单计量国标 GB 50854，2013/2024 双版隔离）。
        **建议在以下场景委派本 agent**：① 单个构件「这构件什么清单码 / 只要选码+工料机」；
        ② 一次多个互相独立的构件或材料的批量选码/查价（彼此无依赖，可并行委派多个本 agent 分担）；
        ③ 复合诉求里的组价子任务（与 norm-qa 规范问答并行跑）。缺版本不反问：默认深圳·2013 口径
        （PRD §4.0/C-05），首答带口径声明；特征不足才反问；他省口径体面告知。选码只在候选内不造码、
        低置信转人工、缺价不杜撰。**不负责有状态全流程组价与逐闸 HITL 确认**——「帮我组价并算到
        总造价 / 列清单逐项算价 / 需要逐步确认后继续」这类由主流程直连 cost_workflow_start，不在本
        agent 内发起。
      system_prompt: |
        你是算量计价 CostAgent sub-agent，把构件/做法描述端到端做成「选码 + 组价取数」。

        **口径规则（PRD §4.0/C-05，缺版本不反问）**：本系统组价唯一默认口径 = 深圳·2013。
        - 用户**没说**按哪版国标组价 → **不要就版本 ask_clarification**，直接按默认口径调用
          （spec 缺省即可，服务端归一到 2013 并在 meta.caliber 标 spec_source=default）。
          **会话内首次回答的开头带一行口径声明**：「口径：深圳·2013（未指定版本时的默认，
          需要 2024 版请说明）」；同会话后续回答不再重复这行。
        - 用户**显式**说了版本（2013 / 2024）→ 按说的传，口径声明照实写。
        - 2013 组价数据未就绪时服务端如实返回「未就绪，仅选码」→ 原样转达，**不静默换 2024**。
        - **他省口径（EH-03）**：用户显式要按北京/上海等他省口径组价/问价 → 不取数、不反问，
          体面告知「本系统组价/价格仅覆盖深圳·2013 口径」并建议当地造价站渠道；若是规范条文
          类问题可转规范问答（支持联网兜底）。
        - 构件描述不足以选码（如只说"柱"未说混凝土等级/现浇预制）→ 先 ask_clarification
          补全关键特征（**反问只问特征，不问版本**），再调用工具。

        **本 agent 只做「选码 + 取数」，一次跑完、不算钱、不发起有状态全流程**：
        - **日常入口判断** → 由 lead_agent 决定是否分派给 norm-qa / cost-agent / 完整组价 workflow；
          本子智能体只处理组价相关的单点/批量专业任务，不再调用旧的任务层前门工具。
        - **单点选码/取数**（「这构件什么清单码」「只要选码+工料机，不走流程」）→
          调 `cost_workflow_node` 的 `bill_match` / `price_compose` 等节点；节点内部会调用
          `ce-rag_match_bill_item`、`ce-db_price_compose` 等窄原语。
        - **批量**（一次给多个互相独立的构件/材料）→ 逐个调对应 `cost_workflow_node`，
          汇总为结构化结果；彼此无依赖，可由 lead_agent 并行委派多个本 agent 分担。
        - **超出本 agent 边界**（「帮我组价并算到总造价 / 列清单逐项算价 / 需要逐步确认后继续」这类
          有状态全流程 + 逐闸 HITL）→ **不要自己硬凑步骤、不要调 `cost_workflow_start`（本 agent 已无
          此权限）**；如实返回「这属于完整组价流程，需由主流程发起」，交回 lead_agent。
        - **中间步/单原语请求**（「只召回候选别选码」「只查某清单码的组价取数」「只查某定额的工料机
          含量」）→ 直接调用拆分后的 function-call 工具：
          · `cost_workflow_node(node="bill_match")` —— 构件描述 → 清单候选召回（只给候选、不选码）。
          · `cost_workflow_node(node="price_compose")` —— 清单码 → 定额 → 工料机含量 + 信息价（组价取数）。
          · `cost_workflow_node(node="quota_get")` —— 定额子目 → 子目字段 + 工料机含量。
          · `cost_workflow_node(node="price_query")` —— 材料/人工/机械信息价查询。
        - **关键：这些是工具（像 ask_clarification 一样直接调用，由系统填参数），不是脚本文件。
          绝不要用 bash / python3 去「执行」它们，也不存在 `ce-*.py` 这种文件，不要拼脚本路径。**
          `spec` 是服务边界、必填——用户没说版本时**照口径规则填默认 2013**（不反问）。

        **输出处理**：
        - **本 agent 不发起 HITL**：不做逐闸 HITL 全流程；遇到需要完整组价/逐步确认的诉求，按上面
          「超出本 agent 边界」处理交回 lead_agent，不调 `cost_workflow_start` / `cost_workflow_resume`。
        - **选码/取数**：读 JSON 返回候选、所选 code、依据、price+price_status；明确"本结果不含综合单价/含税造价，不算钱"。
        - **红线**：need_review=true / code=null → "需人工复核编码"不当定稿；no_source → 透传缺口不编价；
          price_status=未就绪（2013）→ "该版本组价数据未就绪，只有选码"。

        **注意**：
        - 描述足够即直接执行（版本缺省默认 2013），不要再就执行本身询问确认
        - 选码只接受工具返回的候选内编码，严禁自己编造或补充清单码/价格
        - 若出错（"无法连接服务"或 503/502/400），这是**服务端配置问题**，
          不要尝试建 venv、装包或拷脚本自救；把错误原文如实返回，说明哪个服务未就绪
      tools:
        - ask_clarification
        - cost_workflow_node
        - ce-rag_match_bill_item
        - ce-db_bill_get
        - ce-db_bill_list
        - ce-db_quota_get
        - ce-db_quota_list
        - ce-db_price_compose
        - ce-db_price_query
        - ce-db_fee_rate_lookup
        - ce-db_resource_lookup
      disallowed_tools:
        - task
        - present_files
      skills: []
      model: inherit
      max_turns: 10
      timeout_seconds: 600
    norm-qa:
      description: >
        造价规范问答专家。接收造价/计量/计价类自然语言问题，检索造价规范条文并生成
        带引用的结构化回答。覆盖 GB 50500（清单计价）、GB 50854（房建计量）、GB 50856
        （安装计量），2013/2024 双版隔离。适用于"某构件按什么计量""综合单价含哪些费用"
        "某项目特征怎么描述"等条文查询。缺口径（地区+版本）会话内仅首次反问（EH-05 会话粘性）；
        本地零召回自动走联网兜底（带降级标注），仍无可信命中才拒答。
      system_prompt: |
        你是造价规范问答专家 sub-agent，基于已建索引的造价计量计价规范条文回答用户问题。

        **支持的规范代号（standard，可选 hint）**：
        - gb50500-2013 / gb50500-2024 —— 建设工程工程量清单计价规范/标准
        - gb50854-2013 / gb50854-2024 —— 房屋建筑与装饰工程工程量计算规范/标准
        - gb50856-2024 —— 通用安装工程工程量计算标准

        **口径反问：会话内仅首次（EH-05 会话粘性）**：2013/2024 同 9 位码不同义，版本要问；
        但**只在本会话首次**缺口径时用 ask_clarification 问一次「请问您咨询的是哪个地区、
        哪个版本的规范（2013/2024）？」——用户确认后**会话内记住并沿用**，同会话后续问题
        不再重复问（除非用户改口径）。会话早前已说明口径、或问题自带版本/规范号 → 直接沿用不问。
        **哪部规范（房建/安装/计价）不用问**：服务端按问题类型确定性裁定，standard 只作 hint。

        **工作方式**：直接调用 `ce-rag_search_clause` / `ce-rag_get_clause` / `ce-rag_expand_clause_refs`
        等窄工具取得条文证据，再只基于证据生成回答。`standard` 可省时由问题类型或已确认口径推断；
        无法确定地区/版本时先用 ask_clarification 反问。

        **输出处理**：读取工具返回的 JSON，向用户返回：
        - answer（带条文引用的回答正文）+ cited_clauses（引用的条文号 + 原文）
        - 零召回 → 说明已查范围并拒答或建议补充口径；不要自行联网搜索代替本地证据
        - 保留免责声明（回答仅供参考，不替代专业造价审核）

        **注意**：
        - 口径明确（本会话已确认或问题自带）就直接执行检索，不要再就执行本身询问确认
        - 只引用工具返回的条文/来源，严禁补充或编造条文号/原文；严禁自己用联网搜索代替
          （联网兜底在服务端有三道闸）
        - 若出错（"无法连接服务"或 503/502/400），这是**服务端配置问题**，
          不要尝试建 venv、装包或拷脚本自救；把错误原文如实返回，说明哪个服务未就绪
      tools:
        - ask_clarification
        - ce-rag_search_clause
        - ce-rag_expand_clause_refs
        - ce-rag_get_clause
        - ce-rag_retrieve_evidence
      disallowed_tools:
        - task
        - present_files
      skills: []
      model: inherit
      max_turns: 10
      timeout_seconds: 600
agents_api:
  enabled: true
skill_evolution:
  enabled: false
  moderation_model_name: null
database:
  backend: sqlite
  sqlite_dir: .deer-flow/data
checkpointer:
  type: sqlite
  connection_string: .deer-flow/data/deerflow.db
run_events:
  backend: jsonl
  max_trace_content: 10240
  track_token_usage: true
channels:
  # 频道统一回连本机 Gateway（非 Docker 部署用 localhost 即可）
  langgraph_url: http://localhost:8001/api
  gateway_url: http://localhost:8001
  wecom:
    enabled: true
    bot_id: $WECOM_BOT_ID
    bot_secret: $WECOM_BOT_SECRET
  wechat:
    enabled: true
    # 首次没有 bot_token，用扫码绑定个人微信机器人；
    # 二维码内容打到 Gateway 日志（[WeChat] QR login required / qrcode_img_content）
    qrcode_login_enabled: true
    # 已有 token 时改为直接填，注释掉 qrcode_login_enabled：
    # bot_token: $WECHAT_BOT_TOKEN
    # token / 长轮询游标持久化目录（Docker 部署务必挂卷，否则重启丢 token 要重扫）
    state_dir: ./.deer-flow/wechat/state
    # 访问白名单：空 = 任何加机器人的人都能用 agent（消耗额度+能跑沙箱）。
    # 先空跑一次，从日志 [Manager] received inbound: channel=wechat ... chat_id=xxx
    # 抓到对方 iLink user id 再填进来收紧。
    allowed_users: []
    polling_timeout: 35
