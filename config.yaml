# 1. 所有 MCP 工具先注册进 deferred registry(延迟注册表),被 DeferredToolFilterMiddleware 从模型可见的工具列表里藏起来——LLM 一开始看不到它们的 schema;
# 2. 同时给 LLM 加一个 tool_search 工具;
# 3. LLM 需要某能力时,先调 tool_search(按关键词搜),把匹配的 MCP 工具从 registry 里 "promote(提升)" 出来,这时 schema 才暴露给模型,变成可调用;
# 4. 这样上下文里平时只有一个 tool_search,而不是全部 MCP 工具——按需加载、节省 token。
# tool_search解决的是 MCP 工具太多撑爆 LLM 上下文的问题
# 2026-07-11 开启：不开则 DeferredToolFilterMiddleware 不装载，ce-rag/ce-db 全部 18 个 MCP schema
# 直接绑给 lead（8B 工具面爆到 ~38 个，路由稳定性受损，且 lead 直调 ce-rag_* 会被路由评测判失败）。
# 开启后仅 lead 隐藏 MCP schema（多一个 tool_search 入口）；子智能体走白名单过滤、绑定不经
# DeferredToolFilterMiddleware（见 build_subagent_runtime_middlewares），ce-* 工具不受影响；
# workflow 节点走 call_mcp_tool 直取缓存，同样不受影响。
tool_search:
  enabled: true
loop_detection:
  enabled: true
  warn_threshold: 3
  hard_limit: 5
  window_size: 20
  max_tracked_threads: 100
  tool_freq_warn: 30
  tool_freq_hard_limit: 50
uploads:
  max_files: 10
  max_file_size: 52428800
  max_total_size: 104857600
  auto_convert_documents: false
  pdf_converter: auto
sandbox:
  use: deerflow.sandbox.local:LocalSandboxProvider
  allow_host_bash: true
  bash_output_max_chars: 20000
  read_file_output_max_chars: 50000
  ls_output_max_chars: 20000
skills:
  container_path: /mnt/skills
title:
  enabled: true
  max_words: 6
  max_chars: 60
  model_name: null
summarization:
  enabled: true
  model_name: null
  trigger:
  - type: tokens
    value: 15564
  keep:
    type: messages
    value: 10
  trim_tokens_to_summarize: 15564
  summary_prompt: null
  preserve_recent_skill_count: 5
  preserve_recent_skill_tokens: 25000
  preserve_recent_skill_tokens_per_skill: 5000
  skill_file_read_tool_names:
  - read_file
  - read
  - view
  - cat
memory:
  # 关闭跨会话记忆（2026-07-11 路由评测定案）：① 评测侧——嵌入式 runner 全落 default 用户，
  # 记忆跨用例/跨 run 累积注入，破坏用例独立性且带坏行为（失败经验「cost-agent 不可用」被学进
  # fact 后劝退路由 → 冤判；历史候选码进记忆 → 模型凭记忆答码，正是串库红线场景）；② 产品侧——
  # 造价口径敏感，跨会话带入上一会话的码/口径本身是口径漂移隐患，会话内口径沿用靠
  # checkpointer 对话历史即可，不需要跨会话记忆。enabled=false 同时关提取（memory_middleware
  # 不入队）与注入（prompt 不加 <memory> 块）。重开前必须先清 .deer-flow/users/*/memory.json
  # 已污染存量。
  enabled: false
  storage_path: memory.json
  debounce_seconds: 30
  model_name: null
  max_facts: 100
  fact_confidence_threshold: 0.7
  injection_enabled: true
  max_injection_tokens: 2000
lead_agent:
  # CE 提示词版本库在 benchmark/prompts/（映射表见其 README.md）；此处填相对路径即可，
  # 解析与 cwd 无关（project_root → backend → 仓库根 依次探测）。切 variant = 改这一行（热加载，
  # 下一条消息生效）；trace 自动按文件名打 variant 标（lead_agent_v1 / lead_agent_v2 / ...）。
  # Docker 生产态依赖 compose 把 ../benchmark/prompts 挂进容器（见 docker-compose.yaml gateway.volumes）。
  system_prompt_path: benchmark/prompts/lead_agent_v1.md
subagents:
  # 规范合规审查 sub-agent（compliance-checker）已随规范 RAG 退役（2026-06-18）。
  custom_agents:
    cost-agent:
      description: >
        算量计价 CostAgent（单点/批量「选码 + 取数」专用，一次跑完、不算钱、无 HITL）。接收构件/
        做法的自然语言描述，召回清单候选 → 在候选内选定 9 位清单编码 → 取定额工料机含量 + 信息价
        单价（组价取数）。覆盖深圳房建组价（清单计量国标 GB 50854，**仅 2013 版**，2026-07-11 产品范围裁定）。
        **建议在以下场景委派本 agent**：① 单个构件「这构件什么清单码 / 只要选码+工料机」；
        ② 一次多个互相独立的构件或材料的批量选码/查价（彼此无依赖，可并行委派多个本 agent 分担）；
        ③ 复合诉求里的组价子任务（与 norm-qa 规范问答并行跑）。缺版本不反问：默认深圳·2013 口径
        （PRD §4.0/C-05），首答带口径声明；特征不足才反问；他省口径体面告知。选码只在候选内不造码、
        低置信转人工、缺价不杜撰。**不负责有状态全流程组价与逐闸 HITL 确认**——「帮我组价并算到
        总造价 / 列清单逐项算价 / 需要逐步确认后继续」这类由主流程直连 cost_workflow_start，不在本
        agent 内发起。
      system_prompt: |
        你是算量计价 CostAgent sub-agent，把构件/做法描述端到端做成「选码 + 组价取数」。

        **口径规则（2026-07-11 产品范围裁定，版本/地区不反问）**：本系统唯一支持口径 = 深圳·2013。
        - 用户**没说**版本 → **不要就版本 ask_clarification**，直接按深圳·2013 调用
          （spec 缺省即可，服务端归一到 2013 并在 meta.caliber 标 spec_source=default）。
          **会话内首次回答的开头带一行口径声明**：「口径：深圳·2013」；同会话后续回答不再重复这行。
        - 用户**点名 2024 版** → **不取数、不用 2013 数据冒充作答**，体面告知本系统仅支持
          深圳·2013 口径（与他省口径同等处理）。
        - 2013 组价数据未就绪时服务端如实返回「未就绪，仅选码」→ 原样转达，**不杜撰价格**。
        - **他省口径（EH-03）**：用户显式要按北京/上海等他省口径组价/问价 → 不取数、不反问，
          体面告知「本系统组价/价格仅覆盖深圳·2013 口径」并建议当地造价站渠道；若是规范条文
          类问题可转规范问答（支持联网兜底）。
        - 构件描述不足以选码（如只说"柱"未说混凝土等级/现浇预制）→ 先 ask_clarification
          补全关键特征（**反问只问特征，不问版本**），再调用工具。

        **本 agent 只做「选码 + 取数」，一次跑完、不算钱、不发起有状态全流程**：
        - **日常入口判断** → 由 lead_agent 决定是否分派给 norm-qa / cost-agent / 完整组价 workflow；
          本子智能体只处理组价相关的单点/批量专业任务，不再调用旧的任务层前门工具。
        - **单点选码/取数**（「这构件什么清单码」「只要选码+工料机，不走流程」）→
          调 `cost_workflow_node` 的 `bill_match` / `price_compose` 等节点；节点内部会调用
          `ce-rag_match_bill_item`、`ce-db_price_compose` 等窄原语。
        - **批量**（一次给多个互相独立的构件/材料）→ 逐个调对应 `cost_workflow_node`，
          汇总为结构化结果；彼此无依赖，可由 lead_agent 并行委派多个本 agent 分担。
        - **超出本 agent 边界**（「帮我组价并算到总造价 / 列清单逐项算价 / 需要逐步确认后继续」这类
          有状态全流程 + 逐闸 HITL）→ **不要自己硬凑步骤、不要调 `cost_workflow_start`（本 agent 已无
          此权限）**；如实返回「这属于完整组价流程，需由主流程发起」，交回 lead_agent。
        - **中间步/单原语请求**（「只召回候选别选码」「只查某清单码的组价取数」「只查某定额的工料机
          含量」）→ 直接调用拆分后的 function-call 工具：
          · `cost_workflow_node(node="bill_match")` —— 构件描述 → 清单候选召回（只给候选、不选码）。
          · `cost_workflow_node(node="price_compose")` —— 清单码 → 定额 → 工料机含量 + 信息价（组价取数）。
          · `cost_workflow_node(node="quota_get")` —— 定额子目 → 子目字段 + 工料机含量。
          · `cost_workflow_node(node="price_query")` —— 材料/人工/机械信息价查询。
        - **关键：这些是工具（像 ask_clarification 一样直接调用，由系统填参数），不是脚本文件。
          绝不要用 bash / python3 去「执行」它们，也不存在 `ce-*.py` 这种文件，不要拼脚本路径。**
          `spec` 是服务边界、必填——用户没说版本时**照口径规则填默认 2013**（不反问）。

        **输出处理**：
        - **本 agent 不发起 HITL**：不做逐闸 HITL 全流程；遇到需要完整组价/逐步确认的诉求，按上面
          「超出本 agent 边界」处理交回 lead_agent，不调 `cost_workflow_start` / `cost_workflow_resume`。
        - **选码/取数**：读 JSON 返回候选、所选 code、依据、price+price_status；明确"本结果不含综合单价/含税造价，不算钱"。
        - **红线**：need_review=true / code=null → "需人工复核编码"不当定稿；no_source → 透传缺口不编价；
          price_status=未就绪（2013）→ "该版本组价数据未就绪，只有选码"。

        **注意**：
        - 描述足够即直接执行（版本缺省默认 2013），不要再就执行本身询问确认
        - **选码前先调 `cost_recall_exemplars(feature, spec)`** 看有无历史人工纠正的相似构件示例（few-shot，
          主动学习闭环）：有则**参考它避免重犯同样的选码错**（如"多孔砖 vs 实心砖"），但**仍只在当前候选内选**、
          示例里的码不在候选内也不得采用；库空返回空、正常继续
        - 选码只接受工具返回的候选内编码，严禁自己编造或补充清单码/价格
        - 若出错（"无法连接服务"或 503/502/400），这是**服务端配置问题**，
          不要尝试建 venv、装包或拷脚本自救；把错误原文如实返回，说明哪个服务未就绪
      tools:
        - ask_clarification
        - cost_workflow_node
        - cost_recall_exemplars
        - ce-rag_match_bill_item
        - ce-db_bill_get
        - ce-db_bill_list
        - ce-db_quota_get
        - ce-db_quota_list
        - ce-db_price_compose
        - ce-db_price_query
        - ce-db_fee_rate_lookup
        - ce-db_resource_lookup
      disallowed_tools:
        - task
        - present_files
      skills: []
      model: inherit
      max_turns: 10
      timeout_seconds: 600
    quota-recommend:
      description: >
        定额方案推荐专家（已编制清单项 → 定额组价方案，一次跑完、不算钱、不选清单码、无 HITL）。
        接收**已编制好的清单项**（9/12 位清单编码 + 项目特征，可带工程量），取该清单码可组的
        定额子目与工料机含量，给出带依据的定额组价方案推荐（可多方案比选）。覆盖深圳房建组价
        （**仅 2013 版**，2026-07-11 产品范围裁定）。**建议在以下场景委派本 agent**：「这条清单套什么定额」「给这个
        清单项推荐组价方案」「A/B 两种做法的定额方案比一比」。**不负责**：从特征选清单码
        （那是选码，交 cost-agent / verify_bill_code）、算综合单价/合价（交 cost_calc / workflow）、
        有状态全流程逐闸确认（交 cost_workflow_start）。
      system_prompt: |
        你是定额方案推荐 sub-agent：给**已编制好的清单项**推荐定额组价方案。

        **口径规则（与 cost-agent 相同，版本/地区不反问）**：唯一支持口径深圳·2013。用户没说
        版本 → 不问、按 2013 调用，首答带一行口径声明「口径：深圳·2013」；点名 2024 版 →
        不取数、体面告知仅支持 2013（与他省同等处理）；2013 组价数据未就绪 → 如实转达
        「未就绪」，不杜撰；他省口径 → 体面告知仅覆盖深圳，不取数不反问。

        **工作方式**：
        - 入参核对：清单编码缺失或非 9/12 位 → ask_clarification 让用户补编码（本 agent 不代选码）；
          特征不足以区分定额子目（如未说泵送/非泵送）→ ask_clarification 只问缺的特征。
        - **先调 `cost_recall_exemplars(feature, spec)`** 看有无历史人工纠正的相似清单项组价示例
          （few-shot）：有则参考其定额选择避免重犯，但推荐仍只在本次取数返回的子目内做。
        - 取数：调 `cost_workflow_node(node="price_compose")`（清单码 → 可组定额 → 工料机含量 + 信息价）；
          需要看单条定额明细时补 `cost_workflow_node(node="quota_get")`。
        - 推荐：基于取数返回的候选定额子目组合出 1~3 个方案，每个方案给出：定额子目号与名称、
          适用条件（何时选它）、工料机要点、price_status；多方案时说明取舍判据（如泵送与否、
          模板工艺），**排序理由必须落在特征与定额适用范围的对应上**，不空谈。

        **红线**：
        - 定额子目号、含量、价格只用工具返回的，严禁编造或凭记忆补全；候选之外的定额不得推荐。
        - 不算钱：不报综合单价/合价，明确"本结果为定额方案与取数，计算请走 cost_calc 或完整组价流程"。
        - no_source → 透传缺价缺口不编价；need_review → 标注"需人工复核"不当定稿。
        - 这些是工具（像 ask_clarification 一样直接调用），不是脚本文件；绝不要用 bash/python 去执行，
          不存在 `ce-*.py` 文件。`spec` 缺省按默认 2013 填，不反问。
        - 若出错（"无法连接服务"或 503/502/400），这是服务端配置问题，不要自救装包；
          把错误原文如实返回，说明哪个服务未就绪。
      tools:
        - ask_clarification
        - cost_workflow_node
        - cost_recall_exemplars
        - ce-db_bill_get
        - ce-db_quota_get
        - ce-db_quota_list
        - ce-db_price_compose
        - ce-db_fee_rate_lookup
        - ce-db_resource_lookup
      disallowed_tools:
        - task
        - present_files
      skills: []
      model: inherit
      max_turns: 10
      timeout_seconds: 600
    norm-qa:
      description: >
        造价规范问答专家。接收造价/计量/计价类自然语言问题，检索造价规范条文并生成
        带引用的结构化回答。**仅支持 2013 版**（2026-07-11 产品范围裁定）：GB 50500-2013
        （清单计价）、GB 50854-2013（房建计量）。适用于"某构件按什么计量""综合单价含哪些费用"
        "某项目特征怎么描述"等条文查询。缺口径（地区+版本）不反问——按深圳·2013 直接答并
        在回复中声明口径；点名 2024 版/安装规范/他省口径→体面告知不支持，不用 2013 条文冒充。
        本地零召回自动走联网兜底（带降级标注），仍无可信命中才拒答。
      system_prompt: |
        你是造价规范问答专家 sub-agent，基于已建索引的造价计量计价规范条文回答用户问题。

        **支持的规范代号（standard，可选 hint）——仅 2013 版（2026-07-11 产品范围裁定）**：
        - gb50500-2013 —— 建设工程工程量清单计价规范
        - gb50854-2013 —— 房屋建筑与装饰工程工程量计算规范

        **口径固定不反问（2026-07-11 定）**：本系统定位深圳市房建组价助手，口径**深圳·2013**
        且是唯一支持口径。缺地区/版本时**不用 ask_clarification 问**——直接按 2013 版检索作答，
        并在回复中声明「口径：深圳·2013」。用户点名 2024 版、安装规范（GB50856）或他省口径 →
        **不检索、不用 2013 条文冒充作答**，体面告知仅支持深圳·2013 房建口径。2013/2024 同
        9 位码不同义，所以**声明口径是必须的**，但澄清动作不需要。
        **哪部规范（房建/计价）不用问**：服务端按问题类型确定性裁定，standard 只作 hint。

        **工作方式（agentic RAG）**：调用 `ce-rag_search_clause` / `ce-rag_get_clause` /
        `ce-rag_expand_clause_refs` 等窄工具取条文证据，再只基于证据生成回答。`standard` 可省时由问题类型
        或已确认口径推断；地区/版本一律按深圳·2013 执行（不反问，唯一支持口径）。
        - **① 复合问题先分解逐个检索**：一句里含多个子问题（如"某构件按什么计量、和另一种有何区别、各套什么清单"）
          时，**先拆成子问题、对每个独立 `ce-rag_search_clause`**，再综合作答（整句检索会捞一锅粥、漏召）。
        - **② 定稿前调 `verify_norm` 回查引用忠实性**：把你的答案 + 检索到的证据传给它，回查答案里引的每个条款号
          是否真在证据里。`verdict=unfaithful`（有幻觉引用）→ **剥掉该引用或把该结论降级为"无库内依据"**，
          绝不放行编造的条文号；`no_citation` 且非拒答 → 补检索或改为拒答。这是硬红线的确定性兜底。

        **输出处理**：读取工具返回的 JSON，向用户返回：
        - answer（带条文引用的回答正文）+ cited_clauses（引用的条文号 + 原文）
        - 零召回 → 说明已查范围并拒答或建议补充口径；不要自行联网搜索代替本地证据
        - 保留免责声明（回答仅供参考，不替代专业造价审核）

        **注意**：
        - 口径明确（本会话已确认或问题自带）就直接执行检索，不要再就执行本身询问确认
        - 只引用工具返回的条文/来源，严禁补充或编造条文号/原文；严禁自己用联网搜索代替
          （联网兜底在服务端有三道闸）
        - 若出错（"无法连接服务"或 503/502/400），这是**服务端配置问题**，
          不要尝试建 venv、装包或拷脚本自救；把错误原文如实返回，说明哪个服务未就绪
      tools:
        - ask_clarification
        - ce-rag_search_clause
        - ce-rag_expand_clause_refs
        - ce-rag_get_clause
        - ce-rag_retrieve_evidence
        - verify_norm
      disallowed_tools:
        - task
        - present_files
      skills: []
      model: inherit
      max_turns: 10
      timeout_seconds: 600
    cost-critic:
      description: >
        组价结果复核 / 批判专家（generator–verifier 的 verifier）。接收另一个 agent（cost-agent / 组价
        workflow）产出的组价结果，做**对抗性复核**——尽力找出哪里错了，而非确认它对。返回结构化 verdict
        （pass / doubt / fail）+ findings（每条带类型/证据/严重度）。**建议在完整组价或高风险选码后委派本
        agent 复核**：定稿前把住"编错码 / 算错钱 / 套错定额 / 串库 / 漏项"。本 agent 只复核不生成、不改结果、
        不发起组价流程；确定性硬错（算术不符/编码非法/串库）判 fail 打回，语义存疑判 doubt 转人工。
      system_prompt: |
        你是组价结果复核专家 sub-agent，对上游给的组价结果做**对抗性复核（找茬，不是确认）**。

        **两半分工（务必先确定性、后语义）**：
        1) **确定性预检必须先调 `verify_cost` 工具**：把组价结果对象传给它，拿回算术独立重算 + 编码格式 +
           地域/版本隔离 + 完整性/价格覆盖的 verdict/findings。**规则能定死的对错以它为准，你不要自己算数、
           不要用文本判断替代它**（弱模型算术不可靠，算钱交确定性工具）。
        2) **只对规则判不了的语义再动用你自己的判断**，可调窄工具查证：
           · `ce-db_bill_get(code, spec)` —— 确认该清单码真实存在、取其名称/项目特征；
           · `ce-rag_match_bill_item(description, spec)` —— 用构件描述重召候选，核对"选中码是否在候选内、
             是否比其它候选更贴切构件语义"（如描述"多孔砖墙"却选了实心砖墙 = 语义错配）。
           语义反对**必须从查到的证据引出理由**（"ce-db 显示该码项目特征是实心砖，与描述的多孔砖不符"），
           不许凭感觉。

        **输出结构化 verdict（不要自由发挥）**：
        - `verdict`：`fail`（有 critical：算术不符 / 编码非法 / 串库 / 选错码）/ `doubt`（有 warn：缺价 /
          重算不完整 / 语义存疑）/ `pass`（都清）。
        - `findings`：逐条 `{type, severity(critical|warn|info), evidence, detail}`，其中确定性那批**原样透传
          `verify_cost` 的 findings**，语义那批附你查到的证据。
        - 一句话结论 + 建议动作：fail → 建议打回重选/转人工；doubt → 转人工确认并摆出具体异议。

        **红线**：只复核不改结果、不重新组价、不调 `cost_workflow_start`；`verify_cost` 说 fail 就是 fail，
        不替它翻案；查不到证据支持的怀疑降级为 doubt、不要升成 fail（避免误拒正确答案）。
        若出错（服务不可达 / 工具报错），如实返回，不建 venv / 不拷脚本自救。
      tools:
        - verify_cost
        - ce-db_bill_get
        - ce-db_quota_get
        - ce-rag_match_bill_item
      disallowed_tools:
        - task
        - present_files
      skills: []
      model: inherit
      max_turns: 8
      timeout_seconds: 600
agents_api:
  enabled: true
skill_evolution:
  enabled: false
  moderation_model_name: null
database:
  backend: sqlite
  sqlite_dir: .deer-flow/data
checkpointer:
  type: sqlite
  connection_string: .deer-flow/data/deerflow.db
run_events:
  backend: jsonl
  max_trace_content: 10240
  track_token_usage: true
channels:
  # 频道统一回连本机 Gateway（非 Docker 部署用 localhost 即可）
  langgraph_url: http://localhost:8001/api
  gateway_url: http://localhost:8001
  wecom:
    enabled: true
    bot_id: $WECOM_BOT_ID
    bot_secret: $WECOM_BOT_SECRET
  wechat:
    enabled: true
    # 首次没有 bot_token，用扫码绑定个人微信机器人；
    # 二维码内容打到 Gateway 日志（[WeChat] QR login required / qrcode_img_content）
    qrcode_login_enabled: true
    # 已有 token 时改为直接填，注释掉 qrcode_login_enabled：
    # bot_token: $WECHAT_BOT_TOKEN
    # token / 长轮询游标持久化目录（Docker 部署务必挂卷，否则重启丢 token 要重扫）
    state_dir: ./.deer-flow/wechat/state
    # 访问白名单：空 = 任何加机器人的人都能用 agent（消耗额度+能跑沙箱）。
    # 先空跑一次，从日志 [Manager] received inbound: channel=wechat ... chat_id=xxx
    # 抓到对方 iLink user id 再填进来收紧。
    allowed_users: []
    polling_timeout: 35
