#    ✅ T-A5 已注册为**可用模型**，但**非默认**（8b 仍列表第一项 = agent 默认，桶 A 延迟敏感路径）。
#       deer-flow agent（norm-qa/cost-agent）默认仍走 8b；如后续把 workflow 某个节点升级为
