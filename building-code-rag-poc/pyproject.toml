[project]
name = "building-code-rag-poc"
version = "0.0.1"
description = "建筑规范 RAG 项目的技术 POC（PDF 解析、检索、合规判定）"
requires-python = ">=3.12,<3.13"  # torchvision 0.20.x 尚无 cp313 wheel

dependencies = [
    # ===== 阶段 0：PDF 解析 =====
    "torch==2.5.1",          # cu121 wheel 由 [tool.uv.sources] 指定；见 [tool.uv] override-dependencies
    "torchvision==0.20.1",
    "numpy>=1.26",
    "mineru[pipeline]",      # 版面分析 + OCR（包含 six 等传递依赖）
    "six>=1.16",             # mineru OCR 组件显式依赖
    "pymupdf>=1.24",         # PDF 分割主路径（import fitz）
    "pypdf>=4.0",            # PDF 分割 fallback

    # ===== 阶段 1：检索 =====
    "pymilvus>=2.4.0",
    "rank-bm25>=0.2.2",
    "requests>=2.32",        # 调 vLLM embedding / generate API
    "FlagEmbedding>=1.3",    # bge-reranker（需 torch>=2.6 时可选）

    # ===== 检索/合规 HTTP 服务（skill 通过 HTTP 调用，沙箱内零依赖）=====
    "fastapi>=0.110",        # service/server.py
    "uvicorn>=0.29",         # ASGI server

    # 辅助
    "click>=8.1",            # CLI 参数解析
    "rich>=13.7",            # 终端日志/表格输出
    "tqdm>=4.66",
    "pydantic>=2.7",         # 条款树 schema 校验
]

[project.optional-dependencies]

# 调试用
dev = [
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "ruff>=0.6",
]

[tool.uv]
# torch 2.6.0 无 cu121 wheel（2.6.x 起官方转向 cu124，服务器驱动 535.x 不支持）
# mineru 3.2.0 元数据声明 torch>=2.6.0，但实测 2.5.1+cu121 可正常运行
override-dependencies = [
    "torch==2.5.1",
    "torchvision==0.20.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 100
target-version = "py312"
