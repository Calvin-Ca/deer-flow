# 建筑规范 RAG —— 三层服务一键启动
#
# 用法（从项目根执行）：
#   cp docker/rag/.env.example docker/rag/.env   # 首次：填好路径
#   docker compose -f docker/rag/docker-compose.yaml up -d
#
# 停止：
#   docker compose -f docker/rag/docker-compose.yaml down
#
# 查看日志：
#   docker compose -f docker/rag/docker-compose.yaml logs -f
#
# 架构：
#   knowledge(:8100) ← qa(:8102)
#                    ← compliance(:8101)
#
# network_mode: host —— 三个服务直接复用宿主机网络，可直接访问
#   Milvus   :19530、vLLM BGE  :8097、vLLM Qwen3 :8099
# 不需要额外配置 overlay 网络，服务间也通过 localhost 互通。

services:

  # ── ① 知识服务（检索原语，:8100）──────────────────────────────────────────
  knowledge:
    build:
      context: ../..                          # 项目根（COPY ce-code/ 的基准）
      dockerfile: docker/rag/Dockerfile.knowledge
    image: rag-knowledge:latest
    container_name: rag-knowledge
    network_mode: host
    restart: unless-stopped
    environment:
      - CUDA_VISIBLE_DEVICES=${CUDA_DEVICE:-2}      # 默认 GPU 2（显存最多）
      - HF_ENDPOINT=https://hf-mirror.com           # 国内镜像，模型首次下载用
      - NVIDIA_VISIBLE_DEVICES=${CUDA_DEVICE:-2}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${CUDA_DEVICE:-2}"]
              capabilities: [gpu]
    volumes:
      # 向量索引数据（大文件，不进镜像）
      - ${DATA_DIR}:/app/data:ro
      # HuggingFace 模型缓存（bge-reranker-large，避免重复下载）
      - ${HF_CACHE:-~/.cache/huggingface}:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8100/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s     # FlagEmbedding 首次加载模型较慢

  # ── ② qa 任务服务（检索+生成，:8102）──────────────────────────────────────
  qa:
    build:
      context: ../..
      dockerfile: docker/rag/Dockerfile.tasks
    image: rag-tasks:latest
    container_name: rag-qa
    network_mode: host
    restart: unless-stopped
    environment:
      - BCRAG_KNOWLEDGE_URL=${KNOWLEDGE_URL:-http://localhost:8100}
      - BCRAG_LLM_URL=${LLM_URL:-http://localhost:8099}
      - BCRAG_LLM_MODEL_ID=${LLM_MODEL_ID:-qwen3-8b}
    command: ["python", "-m", "uvicorn", "qa.server:app",
              "--host", "0.0.0.0", "--port", "8102"]
    depends_on:
      knowledge:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8102/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── ③ compliance 任务服务（合规编排，:8101）──────────────────────────────
  compliance:
    build:
      context: ../..
      dockerfile: docker/rag/Dockerfile.tasks
    image: rag-tasks:latest
    container_name: rag-compliance
    network_mode: host
    restart: unless-stopped
    environment:
      - BCRAG_KNOWLEDGE_URL=${KNOWLEDGE_URL:-http://localhost:8100}
      - BCRAG_LLM_URL=${LLM_URL:-http://localhost:8099}
      - BCRAG_LLM_MODEL_ID=${LLM_MODEL_ID:-qwen3-8b}
    command: ["python", "-m", "uvicorn", "compliance.server:app",
              "--host", "0.0.0.0", "--port", "8101"]
    depends_on:
      knowledge:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8101/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
