# 全栈一键启动（知识服务 + qa + compliance）
#
# 用法（从项目根执行）：
#   cp docker/ce-services/.env.example docker/ce-services/.env
#   docker compose -f docker/ce-services/docker-compose.yaml up -d
#
# 停止：
#   docker compose -f docker/ce-services/docker-compose.yaml down
#
# 日志：
#   docker compose -f docker/ce-services/docker-compose.yaml logs -f
#
# 架构：
#   knowledge(:8100) ← qa(:8102)
#                    ← compliance(:8101)
#   network_mode: host —— 三服务均直接访问宿主机的 Milvus:19530 / vLLM:8097,8099

include:
  - path: ../ce-code/docker-compose.yaml  # 知识服务（含 GPU、数据卷）

services:

  # ── qa 任务服务（检索+生成，:8102）────────────────────────────────────────
  qa:
    build:
      context: ../..
      dockerfile: docker/ce-services/Dockerfile
    image: rag-tasks:latest
    container_name: rag-qa
    network_mode: host
    restart: unless-stopped
    environment:
      - BCRAG_KNOWLEDGE_URL=${KNOWLEDGE_URL:-http://localhost:8100}
      - BCRAG_LLM_URL=${LLM_URL:-http://localhost:8099}
      - BCRAG_LLM_MODEL_ID=${LLM_MODEL_ID:-qwen3-8b}
    command: ["python", "-m", "uvicorn", "qa.server:app",
              "--host", "0.0.0.0", "--port", "8102"]
    depends_on:
      knowledge:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8102/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── compliance 任务服务（合规编排，:8101）────────────────────────────────
  compliance:
    build:
      context: ../..
      dockerfile: docker/ce-services/Dockerfile
    image: rag-tasks:latest
    container_name: rag-compliance
    network_mode: host
    restart: unless-stopped
    environment:
      - BCRAG_KNOWLEDGE_URL=${KNOWLEDGE_URL:-http://localhost:8100}
      - BCRAG_LLM_URL=${LLM_URL:-http://localhost:8099}
      - BCRAG_LLM_MODEL_ID=${LLM_MODEL_ID:-qwen3-8b}
    command: ["python", "-m", "uvicorn", "compliance.server:app",
              "--host", "0.0.0.0", "--port", "8101"]
    depends_on:
      knowledge:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8101/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
