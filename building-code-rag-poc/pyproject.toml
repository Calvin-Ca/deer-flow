[project]
name = "building-code-rag-poc"
version = "0.0.1"
description = "建筑规范 RAG 项目的技术 POC（PDF 解析、检索、合规判定）"
requires-python = ">=3.12,<3.13"  # torchvision 0.20.x 尚无 cp313 wheel

dependencies = [
    # ===== 阶段 0：PDF 解析 =====
    "torch==2.5.1",          # cu121 wheel 由 [tool.uv.sources] 指定
    "torchvision==0.20.1",
    "numpy>=1.26",
    "mineru[pipeline]",      # 版面分析 + OCR（包含 six 等传递依赖）
    "six>=1.16",             # mineru OCR 组件显式依赖

    # 辅助
    "click>=8.1",            # CLI 参数解析
    "rich>=13.7",            # 终端日志/表格输出
    "tqdm>=4.66",
    "pydantic>=2.7",         # 条款树 schema 校验
]

[project.optional-dependencies]
# 阶段 1+ 才装的：检索、嵌入、向量库
retrieval = [
    "pymilvus>=2.4.0",
    "rank-bm25>=0.2.2",
    "requests>=2.32",        # 调 vLLM embedding API
    "FlagEmbedding>=1.3",    # bge-reranker（可选，需 torch>=2.6）
]

# 调试用
dev = [
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "ruff>=0.6",
]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 100
target-version = "py312"
