[project]
name = "ce-services"
version = "0.1.0"
description = "建筑规范 RAG 任务层 —— qa / compliance 等任务服务（纯 HTTP 客户端，HTTP 调 ce-code 知识服务 :8100）"
requires-python = ">=3.12"
# 任务层是知识服务的纯 HTTP 客户端：不 import retrieval、不连 Milvus/向量库，
# 只依赖 fastapi/uvicorn（起服务）+ requests（调知识服务 :8100 与 vLLM）。
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "requests>=2.32",
    "pydantic>=2.7",
    # HITL 可中断组价图：StateGraph + interrupt/Command + SqliteSaver 文件级 checkpointer。
    # 服务器侧以 `uv add langgraph langgraph-checkpoint-sqlite` 落锁（本地不提交 uv.lock）。
    "langgraph>=0.2.50",
    "langgraph-checkpoint-sqlite>=2.0",
    # 任务层能力 MCP façade（FastMCP streamable-HTTP，:8101/mcp）：把 norm_qa / cost_compose
    # 包成 MCP 工具供 deer-flow agent 直接调，工具名/入参/结果结构化进前端 toolCall 流。
    # 服务器侧以 `uv add mcp` 落锁（本地不提交 uv.lock）。
    "mcp>=1.2",
    # 组价成果导出 xlsx（M2 §3.1 管线⑦，cost/export.py 延迟 import——CSV 路径不吃此依赖）。
    # 服务器侧以 `uv add openpyxl` 落锁（本地不提交 uv.lock）。
    "openpyxl>=3.1",
]

[dependency-groups]
# 测试组（M1 pytest 收编）：服务器 `uv sync` 默认装 dev 组；CI 跑 `uv run pytest tests/ -q`。
# 本地无 pytest 亦可直跑各测试模块（__main__ 兜底，见 tests/*.py 文件头）。
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
