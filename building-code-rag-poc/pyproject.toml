[project]
name = "building-code-rag-poc"
version = "0.0.1"
description = "建筑规范 RAG 项目的技术 POC（PDF 解析、检索、合规判定）"
requires-python = ">=3.12"

dependencies = [
    # ===== 阶段 0：PDF 解析 =====
    # MinerU：中文文档解析（版面、表格、公式、图示）。
    # 注：MinerU 实际包名以服务器 setup 时安装为准（mineru 或 magic-pdf）。
    # 这里先不锁版本，由 setup_server.sh 安装。

    # 辅助
    "click>=8.1",            # CLI 参数解析
    "rich>=13.7",            # 终端日志/表格输出
    "tqdm>=4.66",
    "pydantic>=2.7",         # 条款树 schema 校验
]

[project.optional-dependencies]
# 阶段 1+ 才装的：检索、嵌入、向量库
retrieval = [
    "sentence-transformers>=3.0",
    "qdrant-client>=1.10",
    "rank-bm25>=0.2.2",
    "FlagEmbedding>=1.3",    # bge-large-zh, bge-reranker
]

# 调试用
dev = [
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
