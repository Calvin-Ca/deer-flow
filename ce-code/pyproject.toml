[project]
name = "ce-code"
version = "0.0.1"
description = "规范问答 LLM 微调研究（norm-ft）+ 建筑规范 RAG 技术 POC"
# 注：ce-code/CLAUDE.md §2 原记 Python 3.10，实际沿用本文件既有的 3.12
# （torchvision 0.20.x 尚无 cp313 wheel；且 torch 2.5.1+cu121 正是训练栈所需版本）
requires-python = ">=3.12,<3.13"

dependencies = [
    # ===== 阶段 0：PDF 解析 =====
    "torch==2.5.1",          # cu121 wheel 由 [tool.uv.sources] 指定；见 [tool.uv] override-dependencies
    "torchvision==0.20.1",
    # torchaudio 必须与 torch 同源同版：llamafactory 的 data/mm_plugin.py 模块级无条件
    # import torchaudio，若它从默认源装到通用构建，会与 cu121 的 torch 撞 libstdc++ ABI
    # （libtorchaudio.so: undefined symbol _ZNSt15__exception_ptr...），训练一启动即崩。
    "torchaudio==2.5.1",
    "numpy>=1.26",
    "mineru[all,pipeline]",      # 版面分析 + OCR（包含 six 等传递依赖）
    "six>=1.16",             # mineru OCR 组件显式依赖
    "pymupdf>=1.24",         # PDF 分割主路径（import fitz）
    "pypdf>=4.0",            # PDF 分割 fallback
    # ===== 阶段 1：检索 =====
    "pymilvus>=2.4.0",
    "rank-bm25>=0.2.2",
    "requests>=2.32",        # 调 vLLM embedding / generate API
    "FlagEmbedding>=1.3",    # bge-reranker（需 torch>=2.6 时可选）
    # ===== 检索/合规 HTTP 服务（skill 通过 HTTP 调用，沙箱内零依赖）=====
    "fastapi>=0.110",        # retrieval/server.py
    "uvicorn>=0.29",         # ASGI server
    "mcp>=1.27",             # ce-rag / ce-db MCP façade（FastMCP streamable-HTTP）
    # 辅助
    "click>=8.1",            # CLI 参数解析
    "rich>=13.7",            # 终端日志/表格输出
    "tqdm>=4.66",
    "pydantic>=2.7",         # 条款树 schema 校验
    "psycopg[binary]>=3.3.4",

    # ===== [norm-ft] LLM 调用与数据合成（原 requirements.txt）=====
    "openai>=1.30.0",        # DashScope / 本地 vLLM 的 OpenAI-compatible endpoint
    # 评测集出题换厂商（见 src/utils/claude.py）：与合成模型 Qwen3-32B 去相关，
    # 避免题目撞车与风格耦合。仅 gen_evalset 用到，训练与过滤链路不依赖它。
    "anthropic>=0.69.0",
    "tenacity>=8.3.0",       # 重试 + 指数退避
    "jsonlines>=4.0.0",
    # ===== [norm-ft] 嵌入与相似度（C 组多样性去重 + 评测集泄漏检查）=====
    "sentence-transformers>=3.0.0",
    "scikit-learn>=1.4.0",
    # ===== [norm-ft] 训练框架 =====
    # LLaMA-Factory 自带 peft / trl / accelerate / transformers 的兼容版本，
    # 故此处不单独声明那几个，避免与它的 pin 打架（见 CLAUDE.md §2：走 yaml 配置，
    # 不手写训练循环）。deepspeed extra 提供 ZeRO 支持。
    # deepspeed 直接声明，不走 llamafactory 的 extra——uv 对不存在的 extra 静默忽略，
    # 实测 `llamafactory[...,deepspeed]` 装完 import deepspeed 仍报 ModuleNotFoundError。
    "llamafactory[metrics]>=0.9.2",
    "deepspeed>=0.15.0",
    # ===== [norm-ft] 实验跟踪与评测判分 =====
    "wandb>=0.17.0",
    "scipy>=1.13.0",         # Cohen's Kappa
    "pandas>=2.2.0",
    "regex>=2024.4.16",      # 条款号归一化
]

[project.optional-dependencies]

# 调试用
dev = [
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "ruff>=0.6",
]

[tool.uv]
# torch 2.6.0 无 cu121 wheel（2.6.x 起官方转向 cu124，服务器驱动 535.x 不支持）
# mineru 3.2.0 元数据声明 torch>=2.6.0，但实测 2.5.1+cu121 可正常运行
override-dependencies = [
    "torch==2.5.1",
    "torchvision==0.20.1",
    "torchaudio==2.5.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 100
target-version = "py312"
